name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    name: Static tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile
        run: python -m compileall addon.py main.py src scripts tests
      - name: Test
        run: python -m pytest

  package-check:
    name: Package and import checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Import package
        run: python -c "import overtli_blender; print(overtli_blender.__name__)"
      - name: Fast release check
        run: python scripts/release_check.py --fast --json
      - name: Phase 10B static release gates
        run: |
          python scripts/addon_modularity_check.py --json
          python scripts/build_addon_zip.py --mode package --verify --json
          python scripts/import_boundary_check.py --json
          python scripts/docs_lockdown_check.py --json
          python scripts/release_candidate_check.py --json
      - name: Build package
        run: python scripts/build_python_package.py

  privacy-check:
    name: Privacy and stale identity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Release privacy check
        run: python scripts/release_check.py --fast --skip-build --skip-package --json
