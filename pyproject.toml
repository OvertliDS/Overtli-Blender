[project]
name = "overtli-blender"
version = "0.1.0"
description = "Overtli-Blender local-first Blender MCP integration for inspection, safety, and AI-assisted workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "OvertliDS"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["blender", "mcp", "ai", "3d", "modeling", "geometry-nodes", "procedural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
overtli-blender = "overtli_blender.server:main"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["overtli_blender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "Overtli-Blender_AIReview_Drive",
    ".venv",
    ".pytest_cache",
    "__pycache__",
]

[project.urls]
"Homepage" = "https://github.com/OvertliDS/Overtli-Blender"
"Repository" = "https://github.com/OvertliDS/Overtli-Blender.git"
"Bug Tracker" = "https://github.com/OvertliDS/Overtli-Blender/issues"
"Documentation" = "https://github.com/OvertliDS/Overtli-Blender#readme"
"Changelog" = "https://github.com/OvertliDS/Overtli-Blender/blob/main/CHANGELOG.md"

